<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Etiket — Tek Kaynak (Sheets CSV)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#0b1220;--panel:#0f172a;--line:#1f2a3a;--ink:#e2e8f0;--mut:#94a3b8;--brand:#38bdf8;--ok:#22c55e;--err:#ef4444}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial}
header{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:999px}
.wrap{max-width:1100px;margin:auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:linear-gradient(90deg,#2563eb,#38bdf8);color:#fff}
.input{flex:1;min-width:220px;background:#0b1220;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px}
#pg{position:fixed;right:12px;top:12px;display:none;z-index:9999}
#pg .b{background:#0b1220cc;border:1px solid #243244;color:#e2e8f0;padding:8px 10px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#pg .ok{color:var(--ok)} #pg .err{color:var(--err)} #pg .mut{color:#93c5fd}
#list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.item{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .nm{font-weight:800} .item .bc{font-size:12px;color:var(--mut)}
.etiket{background:#fff;width:280px;height:110px;border-radius:14px;box-shadow:0 1px 6px #00000033;display:flex;flex-direction:row;align-items:flex-start;padding:12px 12px 8px 6px;color:#111}
.etiket-logo{width:70px;height:90px;margin-right:5px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-start}
.etiket-icerik{flex:1;display:flex;flex-direction:column;justify-content:space-between;height:100%}
.etiket-stokadi{font-size:13px;font-weight:600;color:#1f2937;line-height:1.1;min-height:36px;max-height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.etiket-row{display:flex;align-items:flex-end;justify-content:flex-end;gap:4px}
.etiket-fiyat{font-size:26px;color:#e20032;font-weight:700;letter-spacing:1px;margin:0;display:flex;align-items:flex-end;gap:2px;min-width:52px;justify-content:center}
.etiket-barkod{width:72px;height:54px;display:flex;flex-direction:column;align-items:flex-end}
</style>
</head>
<body>
<header>
  <span id="badge" class="badge"><i class="fa-solid fa-database"></i> Beklemede</span>
  <button id="btnFetch" class="btn primary"><i class="fa-solid fa-cloud-download"></i> Sheets'ten Çek</button>
  <input id="q" class="input" placeholder="Ara: ürün adı veya barkod (son 6)" />
</header>
<div class="wrap">
  <div class="card"><div id="list"></div></div>
</div>
<div id="pg"><div class="b"><span id="pgmsg">Hazır</span></div></div>

<script>
(function(){ 
  const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6jHQpQ-T0sta3Y2mUxCWYprz8AAYPCtZa_ofzHX1yMBNj3sNYBFUMUp5Y8tJf-Q/pub?output=csv";
  let DATA = [], VIEW = [];

  const $=id=>document.getElementById(id);
  const fmtTRY=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'});

  function pg(msg, cls){ const el=$('pg'); const m=$('pgmsg'); el.style.display='block'; m.className=cls||''; m.textContent=msg; }
  function pgHide(){ $('pg').style.display='none'; }
  function cleanBarcode(v){ if(v===undefined||v===null) return ''; if(typeof v==='number') return String(Math.trunc(v)).replace(/\\D/g,''); return String(v).replace(/\\D/g,''); }
  function normKey(s){return String(s||'').toLowerCase().replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o').replace(/[üÜ]/g,'u').replace(/[ğĞ]/g,'g').replace(/[şŞ]/g,'s').replace(/[çÇ]/g,'c').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');}
  function parsePrice(v){ if(v===undefined||v===null||v==='') return 0; if(typeof v==='number') return v; let s=String(v).replace(/[₺\\s]/g,''); if(s.includes(',')&&s.includes('.')) s=s.replace(/\\./g,'').replace(',', '.'); else if(s.includes(',')) s=s.replace(',', '.'); return parseFloat(s)||0; }

  const BK=['barkod','barkodu','barkodno','ean','ean13'];
  const NK=['stokadi','urunadi','adi','ad','stok','aciklama','stokadi1','ürünadı','ürün adı'];
  const PK=['magaza','magazasatis','magazasatisfiyati','magazafiyati','satisfiyati1','satisfiyat1','satisfiyati','sf1','perakendesatis','perakende','fiyat','satişfiyatı1','satışfiyatı1'];

  function pickByKeys(row,keys){ const M={}; Object.keys(row).forEach(k=>M[normKey(k)]=k); for(const s of keys){ if(M[s]) return row[M[s]]; for(const k in M){ if(k.includes(s)) return row[M[k]]; } } return undefined; }

  function normalizeRow(r){
    const barcode=cleanBarcode(pickByKeys(r,BK));
    const name=String(pickByKeys(r,NK)||'').trim();
    let val; for(const k of PK){ const v=pickByKeys(r,[k]); if(v!==undefined&&v!==null&&String(v).trim()!==''){ val=v; break; } }
    let price=parsePrice(val);
    if(!price||price<=0){ let best=0; for(const k in r){ const nk=normKey(k); if(nk.includes('tarih')||nk.includes('date')||nk.includes('kod')||nk.includes('birim')) continue; const n=parsePrice(r[k]); if(isFinite(n)&&n>best&&n<1000000) best=n; } price=best||0; }
    // stok alanları (esnek)
    const depo = Number(String(pickByKeys(r,['depo','anadepo','depostok','fethiyedepo','dkdepo'])).replace(',','.'))||0;
    const merkez = Number(String(pickByKeys(r,['merkez','merkezsube','merkezstok'])).replace(',','.'))||0;
    const ataevler = Number(String(pickByKeys(r,['ataevler','ataevlersube','ataevlerstok'])).replace(',','.'))||0;
    const topkapi = Number(String(pickByKeys(r,['topkapi','topkapisube','topkapistok'])).replace(',','.'))||0;
    const fethiye = Number(String(pickByKeys(r,['fethiye','fethiyesube','fethiye4sube','fethiyesubestok'])).replace(',','.'))||0;
    return {barcode,name,price,stocks:{depo,merkez,ataevler,topkapi,fethiye}};
  }

  function buildLabelNode(it){ const c=document.createElement('canvas'); const fmt=/^[0-9]{13}$/.test(it.barcode)?'EAN13':'CODE128'; JsBarcode(c,it.barcode,{format:fmt,height:48,width:2.2,displayValue:true,font:'Arial',fontSize:14,textMargin:2,margin:0,lineColor:'#000'}); 
    const png=c.toDataURL('image/png'); const p=fmtTRY.format(it.price).replace('₺','');
    const w=document.createElement('div'); w.className='etiket';
    w.innerHTML=`<div class="etiket-logo"><div style="font-weight:800;color:#2563eb">DEMIR</div></div>
      <div class="etiket-icerik"><div class="etiket-stokadi">${{it.name}}</div>
      <div class="etiket-row"><div class="etiket-fiyat">${{p}} ₺</div><div class="etiket-barkod"><img src="${{png}}" style="width:100%;height:44px;object-fit:contain"/></div></div></div>`;
    return w; }

  function render(list){ const L=$('list'); L.innerHTML=''; list.slice(0,50).forEach(x=>{ const row=document.createElement('div'); row.className='item'; row.innerHTML=`<div><div class="nm">${{x.name}}</div><div class="bc">${{x.barcode}}</div></div><div><b>${{fmtTRY.format(x.price)}}</b></div>`; row.onclick=()=>{ const m=document.createElement('div'); m.style.marginTop='8px'; m.appendChild(buildLabelNode(x)); row.appendChild(m); }; L.appendChild(row); }); }

  async function fetchCSV(url){ pg('Bağlanılıyor: '+url, 'mut'); const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); const t=await r.text(); if(!t||t.length<10) throw new Error('Boş içerik'); return t; }
  function parseCSV(txt){ const wb=XLSX.read(txt,{type:'string'}); const ws=wb.Sheets[wb.SheetNames[0]]; return XLSX.utils.sheet_to_json(ws,{defval:'',raw:true,cellDates:true}); }

  async function load(){ try{ pg('CSV çekiliyor...', 'mut'); const csv=await fetchCSV(URL); pg('İşleniyor...', 'mut'); const rows=parseCSV(csv);
      const items=rows.map(normalizeRow).filter(x=>x.barcode&&x.name);
      DATA=items; VIEW=items; $('badge').innerHTML=`<i class="fa-solid fa-database"></i> ${items.length} ürün`; render(VIEW); pg('Bitti: '+items.length+' ürün','ok'); setTimeout(pgHide,1200);
    }catch(e){ pg('Hata: '+e.message,'err'); alert('Hata: '+e.message); } }

  $('btnFetch').onclick=load;
  $('q').oninput=()=>{ const v=$('q').value.trim().toLowerCase(); if(!v) return render(VIEW=DATA);
     const key=v.replace(/\\D/g,''); if(key.length>=2) VIEW=DATA.filter(p=>String(p.barcode).endsWith(key)); else VIEW=DATA.filter(p=>(p.name||'').toLowerCase().includes(v)); render(VIEW); };
})(); 
</script>
</body>
</html>
