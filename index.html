<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Etiket — Çift CSV Merge (HARD DEBUG)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Inter,system-ui,Arial}
header{position:sticky;top:0;background:#0b1220;border-bottom:1px solid #1e293b;padding:10px;text-align:center;color:#93c5fd;font-weight:800}
.wrap{max-width:1100px;margin:auto;padding:16px}
.kv{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{flex:1;min-width:220px;background:#0b1220;border:1px solid #1e293b;color:#e2e8f0;padding:10px;border-radius:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn.primary{background:#2563eb;color:#fff}.btn.neutral{background:#0b1220;border:1px solid #1e293b;color:#e2e8f0}
.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid #1e293b;padding:6px 10px;border-radius:20px}
#pg{position:fixed;right:12px;top:12px;display:none;z-index:9999}
#pg .b{background:#0b1220cc;border:1px solid #243244;padding:8px 10px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#pg .ok{color:#22c55e}#pg .err{color:#ef4444}#pg .mut{color:#93c5fd}
#diag{margin-top:10px;border:1px dashed #334155;padding:10px;border-radius:10px;background:#0b1220}
small{color:#94a3b8}
#etiketler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.etiket{background:#fff;width:280px;height:110px;border-radius:14px;box-shadow:0 1px 6px #00000033;display:flex;flex-direction:row;align-items:flex-start;padding:12px 12px 8px 6px;color:#111}
.etiket-logo{width:70px;height:90px;margin-right:5px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-start}
.etiket-icerik{flex:1;display:flex;flex-direction:column;justify-content:space-between;height:100%}
.etiket-stokadi{font-size:13px;font-weight:600;color:#1f2937;line-height:1.1;min-height:36px;max-height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.etiket-row{display:flex;align-items:flex-end;justify-content:flex-end;gap:4px}
.etiket-fiyat{font-size:26px;color:#e20032;font-weight:700;letter-spacing:1px;margin:0;display:flex;align-items:flex-end;gap:2px;min-width:52px;justify-content:center}
.etiket-barkod{width:72px;height:54px;display:flex;flex-direction:column;align-items:flex-end}
textarea{width:100%;height:100px;background:#0b1220;border:1px solid #1e293b;color:#e2e8f0;border-radius:10px;padding:8px}
code{background:#0b1220;padding:2px 6px;border:1px solid #1e293b;border-radius:6px}
</style>
</head>
<body>
<header>Etiket — Çift CSV Merge (HARD DEBUG)</header>
<div class="wrap">
  <div class="kv">
    <span class="badge" id="badge"><i class="fa-solid fa-database"></i> Beklemede</span>
    <button id="btnFetch" class="btn primary"><i class="fa-solid fa-cloud-download"></i> Google Sheets'ten Çek</button>
    <button id="btnPaste" class="btn neutral"><i class="fa-solid fa-paste"></i> CSV'yi Yapıştır</button>
  </div>
  <div id="diag">
    <b>Teşhis</b>
    <div id="dmsg">Henüz işlem yok.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
      <div><small>Ürünler CSV (ilk 300 karakter):</small><textarea id="tP" placeholder="Gerekirse buraya ürün CSV içeriklerini yapıştır"></textarea></div>
      <div><small>Stok CSV (ilk 300 karakter):</small><textarea id="tS" placeholder="Gerekirse buraya stok CSV içeriklerini yapıştır"></textarea></div>
    </div>
    <small>Not: Ürün ve Stok CSV’ler <code>output=csv</code> ile bitmeli. Burada içerik görmüyorsan tarayıcı CSV’ye erişemiyordur.</small>
  </div>
  <div id="etiketler"></div>
</div>

<div id="pg"><div class="b"><span id="pgmsg">Hazır</span></div></div>

<script>
(function(){
  // BU İKİ URL'İ GEREKİRSE DÜZENLE
  const URL_P = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCE485ORNI2xxxHJkrfJy6IBBeso9hQHxfhZ6dkUShRQWngyeyR5VsZI7rKwBy0A/pub?output=csv"; // ürün
  const URL_S = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMkBejpCxER9Mq_QKxmPxkDToCkaWc4HyGAAjgOT0tvO1HjwOIbTPzRO_Lkiw8CQ/pub?output=csv"; // stok

  let PRODUCTS=[];
  const $=id=>document.getElementById(id);
  const fmtTRY=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'});

  function pg(msg, cls){ const el=$('pg'); const m=$('pgmsg'); el.style.display='block'; m.className=cls||''; m.textContent=msg; }
  function pgHide(){ $('pg').style.display='none'; }
  function d(msg){ $('dmsg').innerHTML = msg; }

  function parseBarcode(v){ if(v===undefined||v===null)return''; if(typeof v==='number')return String(Math.trunc(v)).replace(/\D/g,''); return String(v).replace(/\D/g,''); }
  function normKey(s){return String(s||'').toLowerCase().replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o').replace(/[üÜ]/g,'u').replace(/[ğĞ]/g,'g').replace(/[şŞ]/g,'s').replace(/[çÇ]/g,'c').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');}
  function parsePrice(v){ if(v===undefined||v===null||v==='') return 0; if(typeof v==='number') return v; let s=String(v).replace(/[₺\s]/g,''); if(s.includes(',')&&s.includes('.')){ s=s.replace(/\./g,'').replace(',', '.'); } else if(s.includes(',')){ s=s.replace(',', '.'); } return parseFloat(s)||0; }

  const BK= ['barkod','barkodno','ean','ean13'];
  const NK= ['stokadi','urunadi','adi','ad','stok','aciklama','stokadi1'];
  const PK= ['magaza','magazasatis','magazasatisfiyati','magazafiyati','satisfiyati1','satisfiyat1','sf1','fiyat','perakendesatis'];

  function mapRowByKeys(row){
    const nk={};Object.keys(row).forEach(k=>nk[normKey(k)]=k);
    const pick=(keys)=>{for(const s of keys){ if(nk[s]) return row[nk[s]]; for(const k in nk){ if(k.includes(s)) return row[nk[k]]; }} return undefined;};
    const barcode=pick(BK);
    const name=pick(NK);
    const price=pick(PK);
    return {barcode,name,price};
  }
  function normalizeRow(r){ const m=mapRowByKeys(r); return { barcode:parseBarcode(m.barcode), name:String(m.name||'').trim(), price:parsePrice(m.price)}; }

  function mapRowByKeysStocks(row){
    const nk={}; Object.keys(row).forEach(k=> nk[normKey(k)] = k );
    const pick=(arr)=>{ for(const c of arr){ if(nk[c]) return row[nk[c]]; } return undefined; };
    return {
      barcode : pick(BK),
      depo    : pick(['depo','anadepo','fethiyedepo','depostok','fethiyedepostok']),
      merkez  : pick(['merkez','merkezsube','merkezstok']),
      ataevler: pick(['ataevler','ataevlersube','ataevlerstok']),
      topkapi : pick(['topkapi','topkapisube','topkapistok']),
      fethiyesube: pick(['fethiyesube','fethiye4sube','fethiyesubestok','fethiyesube4'])
    };
  }
  function normalizeStockRow(r){
    const m=mapRowByKeysStocks(r);
    const toNum = v => (v===undefined||v===null||v==='') ? 0 : Number(String(v).replace(',','.'))||0;
    return {
      barcode    : parseBarcode(m.barcode),
      depo       : toNum(m.depo),
      merkez     : toNum(m.merkez),
      ataevler   : toNum(m.ataevler),
      topkapi    : toNum(m.topkapi),
      fethiyesube: toNum(m.fethiyesube)
    };
  }

  function buildLabelNode(it){
    const canvas=document.createElement('canvas');
    const fmt=/^[0-9]{13}$/.test(it.barcode)?'EAN13':'CODE128';
    JsBarcode(canvas,it.barcode,{format:fmt,height:48,width:2.2,displayValue:true,font:'Arial',fontSize:14,textMargin:2,margin:0,lineColor:'#000'});
    const barPng=canvas.toDataURL('image/png');
    const priceStr=fmtTRY.format(it.price).replace('₺','');
    const wrap=document.createElement('div'); wrap.className='etiket';
    wrap.innerHTML=`<div class="etiket-logo"><div style="font-weight:800;color:#2563eb">DEMIR</div></div>
      <div class="etiket-icerik">
        <div class="etiket-stokadi">${it.name}</div>
        <div class="etiket-row">
          <div class="etiket-fiyat">${priceStr}&nbsp;₺</div>
          <div class="etiket-barkod"><img src="${barPng}" style="width:100%;height:44px;object-fit:contain"/></div>
        </div>
      </div>`;
    return wrap;
  }

  async function fetchWithDiag(url){
    pg('Bağlanılıyor: ' + url, 'mut');
    let status = 0, text = '';
    try{
      const res = await fetch(url,{cache:'no-store'});
      status = res.status;
      if(!res.ok) throw new Error('HTTP '+res.status);
      text = await res.text();
      return {ok:true, status, text};
    }catch(e){
      return {ok:false, status, text, error:e.message};
    }finally{
      const preview = (text||'').slice(0,300).replace(/[<>]/g, s=>({ '<':'&lt;','>':'&gt;' }[s]));
      d(`<div>URL: <code>${url}</code></div><div>Durum: <b>${status}</b></div><div>Örnek: <pre style="white-space:pre-wrap">${preview}</pre></div>`);
    }
  }

  function parseCSVtoRows(txt){
    const wb = XLSX.read(txt,{type:'string'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{defval:'',raw:true,cellDates:true});
  }

  async function runFetch(){
    $('badge').innerHTML = '<i class="fa-solid fa-database"></i> Çekiliyor...';
    const p = await fetchWithDiag(URL_P);
    if(!p.ok){
      pg('Ürün CSV hatası: ' + p.status, 'err');
      alert('Ürün CSV çekilemedi: ' + p.error + '\nDilersen Ürün CSV içeriğini sol kutuya yapıştır.');
      return;
    }
    $('tP').value = p.text.slice(0,1000);

    pg('Ürün OK. Stok çekiliyor...', 'ok');
    const s = await fetchWithDiag(URL_S);
    if(!s.ok){
      pg('Stok CSV hatası: ' + s.status, 'err');
      alert('Stok CSV çekilemedi: ' + s.error + '\nDilersen Stok CSV içeriğini sağ kutuya yapıştır.');
      return;
    }
    $('tS').value = s.text.slice(0,1000);

    mergeAndRender(p.text, s.text);
  }

  function mergeAndRender(csvP, csvS){
    pg('Birleştiriliyor...', 'mut');
    const rowsP = parseCSVtoRows(csvP);
    const rowsS = parseCSVtoRows(csvS);
    const prod = rowsP.map(normalizeRow).filter(x=>x.barcode&&x.name);
    const stocks = rowsS.map(normalizeStockRow).filter(x=>x.barcode);
    const stockMap=new Map();
    for(const s of stocks){
      const prev=stockMap.get(s.barcode)||{depo:0,merkez:0,ataevler:0,topkapi:0,fethiyesube:0};
      stockMap.set(s.barcode,{
        depo:prev.depo+(s.depo||0),
        merkez:prev.merkez+(s.merkez||0),
        ataevler:prev.ataevler+(s.ataevler||0),
        topkapi:prev.topkapi+(s.topkapi||0),
        fethiyesube:prev.fethiyesube+(s.fethiyesube||0)
      });
    }
    PRODUCTS = prod.map(p=>({ ...p, stocks: stockMap.get(p.barcode)||{depo:0,merkez:0,ataevler:0,topkapi:0,fethiyesube:0} }));

    const grid=$('etiketler'); grid.innerHTML='';
    PRODUCTS.slice(0,6).forEach(p=> grid.appendChild(buildLabelNode(p)) );
    $('badge').innerHTML = '<i class="fa-solid fa-database"></i> ' + PRODUCTS.length + ' ürün + stok';
    pg('Bitti: '+PRODUCTS.length+' ürün', 'ok');
    setTimeout(pgHide, 1200);
  }

  $('btnFetch').onclick = runFetch;
  $('btnPaste').onclick = ()=>{
    const c1 = $('tP').value.trim();
    const c2 = $('tS').value.trim();
    if(!c1 || !c2){ alert('İki tarafa da CSV içeriğini yapıştırmalısın.'); return; }
    mergeAndRender(c1, c2);
  };
})();
</script>
</body>
</html>
