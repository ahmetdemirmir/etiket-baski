<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Etiket Sistemi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <h2>Sepet Test</h2>
  <button id="btnPrint">Yazdır</button>

  <script>
    const { jsPDF } = window.jspdf;

    // Örnek sepet
    let CART = [
      { barkod: "1234567890123", isim: "Pilot Kalem", fiyat: "45.90", fd: "2025-08-01" },
      { barkod: "9876543210987", isim: "Defter A4", fiyat: "32.50", fd: "2025-08-15" },
      { barkod: "3216549870123", isim: "Silgi", fiyat: "12.00", fd: "2025-08-16" }
    ];

    function generateLabelsPDF(cart) {
      if (!cart || cart.length === 0) {
        alert("Sepet boş!");
        return;
      }
      const doc = new jsPDF();
      let x = 10, y = 20;
      let perPage = 28, counter = 0;

      cart.forEach((p, idx) => {
        doc.text(`${p.isim} (${p.barkod}) - ₺${p.fiyat} - FD:${p.fd}`, x, y);
        y += 10;
        counter++;
        if (counter % perPage === 0 && idx < cart.length - 1) {
          doc.addPage();
          y = 20;
        }
      });

      doc.save("etiketler.pdf");
    }

    document.getElementById("btnPrint").addEventListener("click", () => {
      generateLabelsPDF(CART);
    });
  </script>
</body>
</html>
