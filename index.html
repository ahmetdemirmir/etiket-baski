<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fiyat Gör Etiket Bas — 27/sayfa + Güçlendirilmiş Veri Yükleme</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{margin:0;background:#f6f8fc;color:#0f172a;font-family:Inter,system-ui,Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:12px;justify-content:center;padding:12px;border-bottom:1px solid #dbe2f1}
header img{height:42px}
header h1{margin:0;font-size:1.2rem;font-weight:800}
.wrap{max-width:1100px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:16px}
.control{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.input{flex:1;min-width:230px;background:#fff;border:1px solid #e5e7eb;padding:12px;border-radius:12px;font-size:15px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:linear-gradient(90deg,#2563eb,#38bdf8);color:#fff}
.btn.success{background:linear-gradient(90deg,#059669,#34d399);color:#fff}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid #e5e7eb;background:#fff;color:#0b3ea9;padding:7px 10px;border-radius:999px;font-size:12px}
.list{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;margin-top:8px}
.item{display:flex;justify-content:space-between;gap:10px;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
.item:hover{background:#f8fbff}
.mini{font-size:12px;color:#64748b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:80}
.modal.shown{display:flex}
.box{width:min(92vw,580px);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120}
.toast.show{opacity:0.95}
.pdfBox{width:min(95vw,920px);height:90vh;display:flex;flex-direction:column}
.pdfFrame{flex:1;border:1px solid #e5e7eb;border-radius:8px}
#etiketler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.etiket{background:#fff;width:260px;height:100px;border-radius:14px;box-shadow:0 1px 6px #d7d7db55;display:flex;flex-direction:row;align-items:flex-start;padding:12px 12px 8px 6px;position:relative}
.etiket-logo{width:60px;height:78px;margin-right:5px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-start}
.etiket-logo img{width:100%;height:100%;object-fit:contain}
.etiket-icerik{flex:1;display:flex;flex-direction:column;justify-content:space-between;height:100%}
.etiket-stokadi{font-size:12px;font-weight:500;color:#2e2e2e;line-height:1.1;min-height:36px;max-height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.etiket-row{display:flex;align-items:flex-end;justify-content:flex-end;gap:4px}
.etiket-fiyat{font-size:24px;color:#e20032;font-weight:650;letter-spacing:1px;display:flex;align-items:flex-end;gap:2px;min-width:52px;justify-content:flex-end}
.etiket-fiyat .tlsimge{font-size:14px;margin-left:1px}
.etiket-barkod{width:72px;height:45px;display:flex;flex-direction:column;align-items:flex-end}
.etiket-barkod img{width:100%;height:36px;object-fit:contain}
#camSheet,#camSheetIOS{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:9999;display:none}
#camBox,#camBoxIOS{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:min(96vw,720px);background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden}
#camHead,#camHeadIOS{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e5e7eb}
#camMount,#camMountIOS{position:relative;width:100%;height:380px;background:#000}
#camMount video,#camMountIOS video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camFoot,#camFootIOS{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid #e5e7eb;background:#fafafa}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Logo" />
  <h1>Fiyat Gör Etiket Bas</h1>
</header>

<div class="wrap">
  <div class="card">
    <div class="control" style="justify-content:space-between">
      <div class="control">
        <span id="badgeData" class="badge"><i class="fa-solid fa-database"></i> Veri yüklenmedi</span>
      </div>
      <div class="control">
        <button id="btnCart" class="btn"><i class="fa-solid fa-basket-shopping"></i> Sepet: <span id="cartCount">0</span></button>
        <button id="btnPrint" class="btn success"><i class="fa-solid fa-print"></i> Yazdır</button>
        <button id="btnCam" class="btn primary"><i class="fa-solid fa-camera"></i> Kamera Aç</button>
        <button id="btnCamIOS" class="btn"><i class="fa-brands fa-apple"></i> Kamera (iOS)</button>
      </div>
    </div>

    <div class="control" style="margin-top:8px">
      <input id="inpBarcode" class="input" type="text" placeholder="Barkod SON 6 hane" autocomplete="off" />
      <input id="inpName" class="input" type="text" placeholder="Ürün adı" autocomplete="off" />
      <input id="fileExcel" type="file" accept=".xlsx,.xls,.csv" />
      <button id="btnFetchSheets" class="btn primary"><i class="fa-solid fa-cloud-download"></i> Google Sheets'ten Çek</button>
    </div>
    <small class="mini">Yükle: Excel/CSV veya Sheets. Barkodun son 6 hanesi ya da ürün adıyla filtreleyip ürünü aç.</small>
  </div>
</div>

<div id="mdlSearch" class="modal"><div class="box">
  <h3>Filtrelenen Ürünler</h3>
  <div class="mini">Filtre: <span id="mFilter"></span> — <span id="mCount">0</span> sonuç</div>
  <div id="mList" class="list"></div>
  <div class="control" style="justify-content:flex-end"><button id="btnSearchClose" class="btn">Kapat</button></div>
</div></div>

<div id="mdlPdf" class="modal"><div class="box pdfBox">
  <h3>Önizleme — Etiketler</h3>
  <iframe id="pdfFrame" class="pdfFrame"></iframe>
  <div class="control" style="justify-content:flex-end"><button id="btnPdfCancel" class="btn">İptal</button><button id="btnPdfSave" class="btn success">Kaydet</button></div>
</div></div>

<div id="work" style="position:fixed;left:-9999px;top:-9999px;opacity:0"></div>
<div id="toast" class="toast">Veri yüklendi</div>

<script>
(function(){
// ---- 27/sayfa sabit grid ----
const LABELS_PER_PAGE={cols:3,rows:9,gapPx:4,pagePaddingPx:10};

// ---- State ----
let PRODUCTS=[];
let CART=JSON.parse(localStorage.getItem('etiket_cart')||'[]');
const $=id=>document.getElementById(id);
const fmtTRY=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2});
const showToast=(t)=>{const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500);};
function setCart(n){ CART=n; localStorage.setItem('etiket_cart',JSON.stringify(CART)); $('cartCount').textContent=CART.reduce((a,x)=>a+x.qty,0); }
setCart(CART);

// ---- Helpers: parse ----
function fromSci(str){const m=String(str).toLowerCase().match(/^(\\d+(?:\\.\\d+)?)e\\+(\\d+)$/);if(!m)return String(str);const d=m[1].replace('.','');const dec=(m[1].split('.')[1]||'').length;const exp=+m[2];return d+'0'.repeat(Math.max(0,exp-dec));}
function parseBarcode(v){ if(v===undefined||v===null)return''; if(typeof v==='number'){const s=String(v);return s.includes('e+')?fromSci(s).replace(/\\D/g,''):s.replace(/\\D/g,'');} const s=String(v).trim(); if(/e\\+\\d+$/i.test(s)) return fromSci(s).replace(/\\D/g,''); return s.replace(/[^0-9]/g,''); }
function parsePrice(v){ if(v===undefined||v===null||v==='') return 0; if(typeof v==='number') return v; let s=String(v).replace(/[₺\\s]/g,'').replace(/\\u00A0/g,''); if(s.includes(',') && s.includes('.')){ s = s.replace(/\\./g,'').replace(',', '.'); } else if(s.includes(',')){ s = s.replace(',', '.'); } else if(s.includes('.')){ const parts=s.split('.'); const last=parts[parts.length-1]; if(last.length<=2){ s = parts.slice(0,-1).join('') + '.' + last; } else { s = parts.join(''); } } const n=parseFloat(s); return Number.isNaN(n)?0:n; }
function parseExcelDate(v){ if(!v&&v!==0)return null; if(v instanceof Date&&!isNaN(v))return v; if(typeof v==='number'){const epoch=new Date(1899,11,30);return new Date(epoch.getTime()+v*86400000);} const str=String(v).trim(); const m=str.match(/(\\d{1,2})[.\\/-](\\d{1,2})[.\\/-](\\d{2,4})(?:\\s+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?)?/); if(m){const d=new Date(+m[3],+m[2]-1,+m[1],m[4]||0,m[5]||0,m[6]||0); if(!isNaN(d))return d;} if(/^\\d{8}$/.test(str)){const y=str.slice(0,4),mo=str.slice(4,6),da=str.slice(6,8); const d=new Date(+y,+mo-1,+da); if(!isNaN(d))return d;} const d=new Date(str); return isNaN(d)?null:d; }
function normKey(s){return String(s||'').toLowerCase().replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o').replace(/[üÜ]/g,'u').replace(/[ğĞ]/g,'g').replace(/[şŞ]/g,'s').replace(/[çÇ]/g,'c').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');}
function mapRowByKeys(row){ const nk={};Object.keys(row).forEach(k=>nk[normKey(k)]=k); const pick=(syns)=>{for(const s of syns){for(const k in nk){if(k===s||k.includes(s))return row[nk[k]];}} return undefined;}; const barcode=pick(['barkod','barkodno','barkodu','ean','ean13']); const name=pick(['stokadi','urunadi','adi','ad','stok','aciklama']); const price=pick(['magaza','magazasatis','magazasatisfiyati','magazafiyati','satisfiyati1','satisfiyat1','sf1','fiyat','perakendesatis']); const date=pick(['satisfiyati1degtar','satisfiyati1degtarihi','fiyatdegisikliktarihi','fiyatdegtarihi','fdtarihi','degisiktarihi','degistarihi','fiyatguncellemetarihi']); return {barcode,name,price,date}; }
function normalizeRow(r){ const m=mapRowByKeys(r); return { barcode:parseBarcode(m.barcode), name:String(m.name||'').trim(), price:parsePrice(m.price), priceDate:parseExcelDate(m.date) }; }

// ---- UI events ----
$('btnSearchClose').addEventListener('click', ()=> $('mdlSearch').classList.remove('shown'));
$('btnCart').addEventListener('click', ()=> alert('Sepet ekranı bu minimal demoda kapalı.'));

// ---- Google Sheets — Dayanıklı yükleyici ----
const SHEET_ID='1mOXWfC616TIIzodvzziuvVDEeHylfbPearAPeoTxLbc'; // Senin verdiğin ID
const SHEETS_TRY = [
  // gviz CSV
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`,
  // export CSV
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`,
  // published CSV
  `https://docs.google.com/spreadsheets/d/e/2PACX-1vSLLFAJeVOkrRUl2wli6TUZCHIGqRIu1eN-XKmGcq9M3RXDE3eRKP3lacTqiH-sKPNNRywAQH1eGNV9/pub?output=csv`,
  // export XLSX
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx`,
  // published XLSX (senin paylaştığın format)
  `https://docs.google.com/spreadsheets/d/e/2PACX-1vSLLFAJeVOkrRUl2wli6TUZCHIGqRIu1eN-XKmGcq9M3RXDE3eRKP3lacTqiH-sKPNNRywAQH1eGNV9/pub?output=xlsx`
];

async function fetchAsText(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(r.status+' '+r.statusText);
  return await r.text();
}
async function fetchAsArrayBuffer(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(r.status+' '+r.statusText);
  return await r.arrayBuffer();
}

async function loadFromSheets(){
  $('btnFetchSheets').disabled=true;
  let lastErr=null;
  for(const url of SHEETS_TRY){
    try{
      if(url.endsWith('=csv') || url.endsWith('/export?format=csv') || url.includes('/gviz/tq')){
        const csv=await fetchAsText(url);
        const wb=XLSX.read(csv,{type:'string'});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        let rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:true,cellDates:true});
        applyProducts(rows, 'Sheets');
        $('btnFetchSheets').disabled=false;
        return;
      }else{ // xlsx
        const ab=await fetchAsArrayBuffer(url);
        const wb=XLSX.read(new Uint8Array(ab),{type:'array',cellDates:true});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        let rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:true,cellDates:true});
        applyProducts(rows, 'Sheets');
        $('btnFetchSheets').disabled=false;
        return;
      }
    }catch(err){ lastErr=err; }
  }
  $('btnFetchSheets').disabled=false;
  alert('Google Sheets verisi alınamadı. (CORS/erişim)\\nDetay: '+(lastErr?.message||lastErr));
}

function applyProducts(rows, sourceLabel){
  let arr=rows.map(normalizeRow).filter(x=>x.barcode&&x.name);
  if(arr.length<3){
    // Header yoksa otomatik sütun tespit et
    const A=XLSX.utils.sheet_to_json(XLSX.utils.json_to_sheet(rows),{header:1,defval:''});
  }
  PRODUCTS=arr;
  const badge=$('badgeData');
  badge.innerHTML = `<i class="fa-solid fa-database"></i> ${PRODUCTS.length>0?PRODUCTS.length+' ürün yüklendi ('+sourceLabel+')':'Hiç ürün okunamadı'}`;
  if(PRODUCTS.length>0) showToast('Veri yüklendi');
  else alert('Uygun satır bulunamadı.');
}

$('btnFetchSheets').addEventListener('click', loadFromSheets);

// ---- Manuel Excel/CSV ----
$('fileExcel').addEventListener('change', (ev)=>{
  const f=ev.target.files[0]; if(!f) return;
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  const loadWB=(wb)=>{
    try{
      const sheet=wb.Sheets[wb.SheetNames[0]];
      let rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:true,cellDates:true});
      applyProducts(rows, 'Excel');
    }catch(err){
      alert('Excel/CSV okunamadı: '+(err?.message||err));
    }
  };
  const r=new FileReader();
  if(ext==='csv'){
    r.onload=e=>{ try{ const wb=XLSX.read(e.target.result,{type:'string'}); loadWB(wb); }catch(err){ alert('CSV okunamadı: '+(err?.message||err)); } };
    r.readAsText(f);
  }else{
    r.onload=e=>{ try{ const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true}); loadWB(wb); }catch(err){ alert('XLSX okunamadı: '+(err?.message||err)); } };
    r.readAsArrayBuffer(f);
  }
});

// ---- Arama ----
function showResults(title,arr){ $('mFilter').textContent=title; $('mCount').textContent=arr.length; const L=$('mList'); L.innerHTML=''; arr.slice(0,200).forEach(p=>{ const li=document.createElement('div'); li.className='item'; li.innerHTML=`<div><div style="font-weight:800">${p.name}</div><div class="mini">${p.barcode}</div></div><div style="font-weight:900">${fmtTRY.format(p.price)}</div>`; li.onclick=()=>{ $('mdlSearch').classList.remove('shown'); openProduct(p); }; L.appendChild(li); }); $('mdlSearch').classList.add('shown'); }
function filterByName(q){ const s=q.trim().toLowerCase(); if(s.length<2){ $('mdlSearch').classList.remove('shown'); return; } const res=PRODUCTS.filter(p=>p.name.toLowerCase().includes(s)); if(res.length) showResults(`Ad: "${q}"`,res); else $('mdlSearch').classList.remove('shown'); }
function filterByLast6(v){ const t=v.replace(/\\D/g,''); if(t.length<2){ $('mdlSearch').classList.remove('shown'); return; } const res=PRODUCTS.filter(p=>p.barcode.endsWith(t)); if(res.length) showResults(`Barkod son: ${t}`,res); else $('mdlSearch').classList.remove('shown'); }
$('inpName').addEventListener('input', ()=> filterByName($('inpName').value));
$('inpBarcode').addEventListener('input', ()=> filterByLast6($('inpBarcode').value));

// ---- Ürün aç/addToCart (kısa) ----
function openProduct(p){
  const q = parseInt(prompt(`${p.name}\n${fmtTRY.format(p.price)} — Barkod: ${p.barcode}\nKaç adet?`, '1'));
  if(!(q>0)) return;
  const i=CART.findIndex(x=>x.barcode===p.barcode);
  if(i>-1) CART[i].qty+=q; else CART.push({barcode:p.barcode,name:p.name,price:p.price,qty:q,isOld:false});
  setCart(CART);
}

// ---- PDF (27/sayfa sabit, margin=0) ----
async function renderPage(labelsSlice){
  const pagePxW=794,pagePxH=1123,pad=LABELS_PER_PAGE.pagePaddingPx,gap=LABELS_PER_PAGE.gapPx,cols=LABELS_PER_PAGE.cols,rows=LABELS_PER_PAGE.rows;
  const cellW=Math.floor((pagePxW-pad*2-gap*(cols-1))/cols), cellH=Math.floor((pagePxH-pad*2-gap*(rows-1))/rows);
  const page=document.createElement('div');
  page.style.cssText=`width:${pagePxW}px;height:${pagePxH}px;display:grid;grid-template-columns:repeat(${cols},${cellW}px);grid-auto-rows:${cellH}px;gap:${gap}px;padding:${pad}px;background:#fff;`;
  for(const it of labelsSlice){
    const cell=document.createElement('div'); cell.style.cssText="position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px;";
    if(it && it.__empty){ page.appendChild(cell); continue; }
    const node=buildLabelNode(it);
    // ölçekle
    const off=document.createElement('div'); off.style.cssText="position:absolute;left:-10000px;top:-10000px;opacity:0;"; off.appendChild(node); document.body.appendChild(off);
    const r=node.getBoundingClientRect(); const naturalW=Math.max(1,r.width), naturalH=Math.max(1,r.height); document.body.removeChild(off);
    const scale=Math.min(cellW/naturalW,cellH/naturalH);
    node.style.transformOrigin="top left"; node.style.transform=`scale(${scale})`;
    const holder=document.createElement('div'); holder.style.cssText="position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;"; holder.appendChild(node);
    cell.appendChild(holder); page.appendChild(cell);
  }
  return page;
}
function buildLabelNode(it){
  if(!it || !it.barcode){
    const wrap=document.createElement('div'); wrap.className='etiket'; return wrap;
  }
  const canvas=document.createElement('canvas'); const fmt=/^[0-9]{13}$/.test(it.barcode)?'EAN13':'CODE128';
  try{ JsBarcode(canvas,it.barcode,{format:fmt,height:44,width:2,displayValue:true,font:'Arial',fontSize:12,textMargin:2,margin:0,lineColor:'#000'});}catch(e){}
  const barPng=canvas.toDataURL('image/jpeg',0.82);
  const priceStr=fmtTRY.format(it.price).replace('₺','');
  const wrap=document.createElement('div'); wrap.className='etiket';
  wrap.innerHTML=`<div class="etiket-logo"><img src="logo.png" alt="Logo"></div><div class="etiket-icerik"><div class="etiket-stokadi">${it.name||''}</div><div class="etiket-row"><div class="etiket-fiyat">${priceStr} <span class="tlsimge">₺</span></div><div class="etiket-barkod">${it.barcode?('<img src="'+barPng+'" alt="Barkod">'):''}</div></div></div>`;
  return wrap;
}

$('btnPrint').addEventListener('click', async ()=>{
  if(CART.length===0){ alert('Sepet boş.'); return; }
  const labels=[]; CART.forEach(it=>{ for(let i=0;i<it.qty;i++) labels.push(it); });
  const per=LABELS_PER_PAGE.cols*LABELS_PER_PAGE.rows; // 27
  const pages=Math.max(1,Math.ceil(labels.length/per));
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const work=document.getElementById('work'); work.innerHTML='';

  for(let p=0;p<pages;p++){
    if(p>0) doc.addPage();
    const slice=labels.slice(p*per,p*per+per);
    while(slice.length<per) slice.push({__empty:true}); // grid sabit
    const page=await renderPage(slice); work.appendChild(page);
    const canvas=await html2canvas(page,{scale:3,useCORS:true,allowTaint:true,background:'#fff'});
    const img=canvas.toDataURL('image/jpeg',0.92);
    doc.addImage(img,'JPEG',0,0,210,297); // margin=0
  }
  const blob=doc.output('blob'); const url=URL.createObjectURL(blob);
  $('pdfFrame').src=url; $('mdlPdf').classList.add('shown');
});
$('btnPdfCancel').addEventListener('click', ()=> $('mdlPdf').classList.remove('shown'));
$('btnPdfSave').addEventListener('click', ()=>{
  const { jsPDF }=window.jspdf; // not strictly needed; using last doc would be better; in this minimal demo we just tell user to "İndir" from iframe if needed.
  alert('PDF indir penceresinden kaydedebilirsiniz (tarayıcı indir simgesi).');
});
